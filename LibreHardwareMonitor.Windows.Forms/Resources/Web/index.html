<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="K26K HWMon">
  <title>K26K Hardware Monitor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="status" id="status" title="Verbindung"></span>
      <div class="title-text">
        <h1 id="machine">K26K Hardware Monitor</h1>
        <div class="subtitle" id="subtitle">Verbinde …</div>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menü" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>

  <div class="menu" id="menu" hidden>
    <label class="menu-row"><span>Suche</span><input type="search" id="filter" placeholder="Sensor filtern …" autocomplete="off"></label>
    <div class="menu-row">
      <span>Zeitraum der Kurven</span>
      <div class="chips" id="spanChips"></div>
    </div>
    <div class="menu-row buttons">
      <button class="btn" id="expandAll">Alle aufklappen</button>
      <button class="btn" id="collapseAll">Alle zuklappen</button>
      <button class="btn" id="resetLocal">Wie am Desktop</button>
    </div>
    <div class="menu-row info" id="mirrorInfo"></div>
    <div class="menu-row links">
      <a href="classic.html">Klassische Ansicht</a>
      <a href="data.json" target="_blank" rel="noopener">data.json</a>
      <a href="https://github.com/unikum-sol/K26K-Hardware-Monitor" target="_blank" rel="noopener">Quellcode (AGPL-3.0)</a>
    </div>
  </div>

  <main id="main">
    <section class="card plot-card" id="plotCard" hidden>
      <div class="card-head static">
        <span class="card-title">Plot</span>
        <span class="card-meta" id="plotMeta"></span>
      </div>
      <div id="plotCharts"></div>
    </section>
    <div id="tree"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
